name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships Python 3.9, so that is the oldest version we promise.
          - { os: macos-latest, python: "3.9" }
          - { os: windows-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests and the real probe on this OS
        run: python -m unittest discover tests -v

      # End to end: the runner acts as its own spare machine over real SSH,
      # set up with the same commands the README gives the user.
      - name: SSH server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      - name: SSH server (macOS)
        if: runner.os == 'macOS'
        run: |
          # Remote Login is already on for GitHub's macOS runners.
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist || true
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_girdish
          cat ~/.ssh/id_girdish.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          # The runner offers other keys first; point SSH at ours only.
          printf 'Host localhost\n  IdentityFile ~/.ssh/id_girdish\n  IdentitiesOnly yes\n' >> ~/.ssh/config

      - name: SSH server (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          ssh-keygen -t ed25519 -N '""' -f "$env:USERPROFILE\.ssh\id_ed25519"
          $key = Get-Content "$env:USERPROFILE\.ssh\id_ed25519.pub"
          Add-Content -Force -Path "$env:ProgramData\ssh\administrators_authorized_keys" -Value $key
          icacls.exe "$env:ProgramData\ssh\administrators_authorized_keys" /inheritance:r /grant "*S-1-5-32-544:F" /grant "*S-1-5-18:F"

      - name: Girdish over SSH
        shell: bash
        run: |
          # No manual first connection: Girdish must accept the new host key itself.
          python girdish.py add self localhost
          python girdish.py status --fresh | python -c "import json,sys; m=json.load(sys.stdin)['machines'][0]; assert m['online'], m; print('online as', m['os'])"
          # Shared CI runners are often busy; let pick accept this one anyway.
          python girdish.py limits --max-load-per-core 1000
          python tests/run_via_pick.py
